name: Build, test and publish

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        go: ['1.22', '1.26']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: src/go.sum
      - name: Test Go
        working-directory: src
        run: go test -race -short ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build frontend and amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.standalone
          platforms: linux/amd64
          load: true
          tags: factorio-manager:test
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test bundled game and manager
        run: bash docker/smoke-test.sh factorio-manager:test
      - name: Log in to GHCR
        if: github.repository == 'Szer/factorio-server-manager' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.repository == 'Szer/factorio-server-manager' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/szer/factorio-server-manager
          REVISION: ${{ github.sha }}
        run: |
          docker tag factorio-manager:test "$IMAGE:sha-$REVISION"
          docker tag factorio-manager:test "$IMAGE:master"
          docker push "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:master"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$REVISION")
          echo "Published: \`$IMAGE:sha-$REVISION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Dockge image: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
